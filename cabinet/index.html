<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07070D">
<title>WIKKI.OCEAN · кабинет</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400 900;font-display:swap;src:url(../assets/fonts/dmsans-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400 900;font-display:swap;src:url(../assets/fonts/dmsans-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#07070D;--s1:#0F0D17;--s2:#14111F;--v:#9B6FE8;--vb:#C4A4FF;--vd:#5B2FBE;--text:#F2EDE2;--muted:rgba(242,237,226,.58);--line:rgba(196,164,255,.16);--ok:#7DDDB0;--warn:#FFA3A3;--f:'DM Sans',-apple-system,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--f);background:radial-gradient(ellipse 70% 30% at 60% 0,rgba(91,47,190,.16),transparent 70%),var(--bg);color:var(--text);min-height:100svh;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:left}
a{color:inherit}
[hidden]{display:none!important}
/* каркас */
.shell{min-height:100svh}
.side{display:none}
.main{max-width:880px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
.main.wide{max-width:1120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(7,7,13,.94) 40%)}
.tabbar div{max-width:520px;margin:0 auto;display:flex;gap:2px;padding:5px;border-radius:22px;background:rgba(20,17,31,.94);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:16px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
.tabbar a svg{width:21px;height:21px}
.tabbar a.on{color:#fff;background:linear-gradient(180deg,rgba(169,131,242,.42),rgba(91,47,190,.34))}
.tabbar a .bd{position:absolute;margin:-4px 0 0 16px;min-width:16px;height:16px;border-radius:9px;background:var(--v);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){
 .shell{display:grid;grid-template-columns:240px 1fr}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100svh;padding:26px 16px;border-right:1px solid var(--line);background:rgba(15,13,23,.6)}
 .side .brand{padding:0 10px 22px}
 .side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-size:14.5px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:2px}
 .side a svg{width:20px;height:20px;flex:none}
 .side a:hover{color:#fff;background:rgba(255,255,255,.04)}
 .side a.on{color:#fff;background:linear-gradient(180deg,rgba(169,131,242,.3),rgba(91,47,190,.22));border:1px solid rgba(225,208,255,.28)}
 .side a .bd{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--v);color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 6px}
 .side .me{margin-top:auto;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13px}
 .side .me b{display:block;font-size:14.5px}
 .side .me button{margin-top:8px;font-size:12.5px;color:var(--muted);text-decoration:underline}
 .tabbar{display:none}
 .main{padding:0 36px 60px}
}
.brand{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--vb);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 6px}
.top .who{font-size:13px;color:var(--muted)}
@media(min-width:900px){.top{display:none}}
h1.t{font-size:clamp(25px,5.5vw,34px);font-weight:900;line-height:1.08;letter-spacing:-.02em;text-transform:uppercase;margin:18px 0 6px}
h2.t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vb);font-weight:700;margin:28px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2.t small{letter-spacing:0;text-transform:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.sub{color:var(--muted);font-size:14.5px}
.card{border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012) 60%,rgba(91,47,190,.08)),var(--s1);border:1px solid var(--line);padding:18px}
.card.p0{padding:4px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(180deg,#B691F8 0%,#8B5CE8 48%,#5B2FBE 100%);border:1px solid rgba(225,208,255,.5);box-shadow:0 12px 30px -14px rgba(155,111,232,.8),inset 0 1px 0 rgba(255,255,255,.4);text-decoration:none;text-align:center}
.btn.g{background:rgba(255,255,255,.04);border-color:rgba(196,164,255,.3);box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#58c996,#2f8f68);border-color:rgba(160,240,205,.5);box-shadow:none}
.btn.wr{background:rgba(255,163,163,.1);border-color:rgba(255,163,163,.45);box-shadow:none;color:#ffd0d0}
.btn.s{height:38px;padding:0 16px;font-size:13.5px}
.btn:disabled{opacity:.4;pointer-events:none}
input[type=text],input[type=search],textarea{width:100%;background:#0B0A12;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 15px;font-size:16px;outline:none}
input[type=date],input[type=datetime-local],input[type=number]{width:100%;background:#0B0A12;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 15px;font-size:16px;outline:none;color-scheme:dark}
select.sel{width:100%;margin:0 0 14px;background:#0B0A12;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text);outline:none}
.erow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.erow:last-of-type{border-bottom:none}
.erow>div{flex:1;display:grid;gap:10px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1.1fr}}
.rb{display:flex;gap:4px;padding-top:22px}
.rb button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--s1);color:var(--muted);text-align:center;font-size:14px}
.rb button:hover{color:#fff;border-color:var(--v)}
.flt a.sn{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:700;color:var(--muted);text-decoration:none}
.flt a.sn.on{color:#fff;background:linear-gradient(180deg,rgba(169,131,242,.42),rgba(91,47,190,.32));border-color:rgba(225,208,255,.5)}
.fun{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:7px;position:relative;overflow:hidden;max-width:260px}
.fun i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.fun .f1{background:rgba(196,164,255,.28)}.fun .f2{background:rgba(155,111,232,.7)}.fun .f3{background:linear-gradient(90deg,#7C4FD4,#C4A4FF)}
.wk .nw{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--v);color:#fff;vertical-align:2px}
input:focus,textarea:focus{border-color:var(--v)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
small.l{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(155,111,232,.14);border:1px solid rgba(196,164,255,.28);color:#E4D6FF}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(155,111,232,.12);border:1px solid rgba(196,164,255,.28);color:#E4D6FF}
.chip.warn{background:rgba(255,163,163,.1);border-color:rgba(255,163,163,.4);color:#ffc6c6}
.chip.ok{background:rgba(125,221,176,.1);border-color:rgba(125,221,176,.35);color:#c5f2de}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.err{color:var(--warn);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b1530;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
/* статусы */
.st{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid}
.st-todo{color:var(--muted);border-color:rgba(255,255,255,.18)}
.st-review{color:#E4D6FF;border-color:rgba(196,164,255,.5);background:rgba(155,111,232,.16)}
.st-revision{color:#ffc6c6;border-color:rgba(255,163,163,.5);background:rgba(255,163,163,.1)}
.st-done{color:#c5f2de;border-color:rgba(125,221,176,.45);background:rgba(125,221,176,.1)}
/* вход */
.gate{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:420px;margin:0 auto;padding:24px 16px}
.gate .code{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;text-align:center;font-size:20px}
/* обзор */
.hero{display:grid;grid-template-columns:104px 1fr;gap:20px;align-items:center;margin-top:16px}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.07)}
.ring .rv{stroke:rgba(196,164,255,.38);transition:stroke-dashoffset .8s}
.ring .fg{stroke:url(#rg);transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;font-weight:900}
.depth .m{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.depth .m small{font-size:15px;color:var(--muted);font-weight:600}
.depth p{font-size:13px;color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
@media(min-width:700px){.tiles.f4{grid-template-columns:repeat(4,1fr)}}
.tile{padding:16px;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.tile b{display:block;font-size:30px;font-weight:900;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.3}
.tile.hot{border-color:rgba(255,163,163,.45);background:linear-gradient(160deg,rgba(255,163,163,.1),transparent),var(--s1)}
.tile.vio{border-color:rgba(225,208,255,.42);background:linear-gradient(160deg,rgba(169,131,242,.22),rgba(91,47,190,.08)),var(--s1)}
.tile.good{border-color:rgba(125,221,176,.35)}
.next{display:block;width:100%;margin-top:16px;padding:18px;border-radius:20px;background:linear-gradient(160deg,rgba(169,131,242,.26),rgba(91,47,190,.14));border:1px solid rgba(225,208,255,.4);text-decoration:none}
.next small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--vb);font-weight:700;margin-bottom:5px}
.next b{display:block;font-size:17px;line-height:1.3}
.news{margin-top:14px;padding:14px 16px;border-radius:16px;background:rgba(155,111,232,.12);border:1px solid rgba(196,164,255,.4)}
.news small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--vb);font-weight:700;margin-bottom:4px}
.news p{font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.news button{margin-top:10px;font-size:13px;font-weight:700;color:var(--vb)}
.att{margin-top:12px;padding:14px 16px;border-radius:16px;background:rgba(255,163,163,.07);border:1px solid rgba(255,163,163,.35)}
.att a{display:block;text-decoration:none;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14.5px}
.att a:first-of-type{border-top:none}
.att a small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.path{position:relative;margin-top:6px;padding-left:46px}
.path::before{content:'';position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:linear-gradient(180deg,#9B6FE8,rgba(155,111,232,.15))}
.wk{position:relative;display:block;width:100%;padding:13px 14px;margin-bottom:8px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-decoration:none}
.wk .n{position:absolute;left:-46px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;background:#0B0A12;border:1.5px solid rgba(196,164,255,.45)}
.wk.done .n{background:#5B2FBE;border-color:#C4A4FF}
.wk.cur{border-color:rgba(225,208,255,.55);background:linear-gradient(160deg,rgba(169,131,242,.16),rgba(91,47,190,.08)),var(--s1)}
.wk.lock{opacity:.5}.wk.lock .n{border-style:dashed}
.wk .k{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.wk b{display:block;font-size:15.5px;margin-top:2px}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7C4FD4,#C4A4FF)}
.bar i.r{background:rgba(196,164,255,.38)}
/* задания */
.flt{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.flt::-webkit-scrollbar{display:none}
.flt button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:700;color:var(--muted)}
.flt button.on{color:#fff;background:linear-gradient(180deg,rgba(169,131,242,.42),rgba(91,47,190,.32));border-color:rgba(225,208,255,.5)}
.flt button em{font-style:normal;opacity:.7;margin-left:4px}
.tr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07);text-decoration:none}
.tr:last-child{border-bottom:none}
.tr b{font-size:15px;font-weight:600;line-height:1.35;display:block}
.tr small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tr.todo b{font-weight:600}
.tr.done b{color:var(--muted)}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 0 8px}
.wh b{font-size:15px}.wh span{font-size:12.5px;color:var(--muted)}
/* задание */
.back{display:inline-flex;align-items:center;gap:6px;padding:14px 0 4px;color:var(--muted);font-size:14px;text-decoration:none}
.fbk{margin-top:14px;padding:16px;border-radius:18px;background:linear-gradient(160deg,rgba(169,131,242,.2),rgba(91,47,190,.1));border:1px solid rgba(225,208,255,.45)}
.fbk.bad{background:rgba(255,163,163,.07);border-color:rgba(255,163,163,.45)}
.fbk small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--vb);font-weight:700;margin-bottom:6px}
.fbk.bad small{color:#ffc6c6}
.fbk p{font-size:15px;line-height:1.5;white-space:pre-wrap}
.ans{white-space:pre-wrap;font-size:14.5px;line-height:1.5;word-break:break-word}
.lk{color:var(--vb);font-weight:700;text-decoration:underline;text-underline-offset:3px;word-break:break-all;font-size:13.5px}
.goal{font-size:15.5px;line-height:1.5;color:rgba(242,237,226,.9);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.trackbox{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(155,111,232,.1);border:1px solid rgba(196,164,255,.25);font-size:14px}
.trackbox small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--vb);font-weight:700;margin-bottom:3px}
.mat{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;text-decoration:none}
.mat .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(155,111,232,.14);border:1px solid rgba(196,164,255,.25);color:var(--vb)}
.mat .ic svg{width:18px;height:18px}
.mat b{display:block;font-size:14.5px}.mat small{font-size:12.5px;color:var(--muted)}
.mat.soon{opacity:.55}.mat .tag{margin-left:auto;font-size:11px;color:var(--muted)}
.meet{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}.meet:last-child{border-bottom:none}
.meet b{font-size:14.5px;display:block}.meet small{font-size:12.5px;color:var(--muted)}
.cal{font-size:12.5px;font-weight:700;color:var(--vb);text-decoration:underline;text-underline-offset:3px;margin-left:10px;cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:600;line-height:1.25;text-align:center}
.seg button.on{background:linear-gradient(180deg,rgba(169,131,242,.45),rgba(91,47,190,.35));border-color:rgba(225,208,255,.6)}
.segd{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:36px}
.lib li{list-style:none;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14.5px}.lib li:last-child{border-bottom:none}
.idx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* управление */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:0 10px 10px}
.tbl td{padding:12px 10px;border-top:1px solid rgba(255,255,255,.07);vertical-align:middle}
.tbl tr.lnk{cursor:pointer}.tbl tr.lnk:hover td{background:rgba(255,255,255,.03)}
.tbl .nm b{display:block;font-size:15px}.tbl .nm small{color:var(--muted);font-size:12.5px}
.tblw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl.min{min-width:620px}
.mini{height:6px;width:100px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#7C4FD4,#C4A4FF)}.mini i.r{background:rgba(196,164,255,.38)}
.heat{display:grid;gap:4px;align-items:center}
.heat .h{font-size:11px;color:var(--muted);text-align:center}
.heat .nm{font-size:13px;font-weight:600;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:34px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:700;position:relative;color:#fff}
.cell.lk0{background:rgba(255,255,255,.03);color:var(--muted);border:1px dashed rgba(255,255,255,.12)}
.cell .dot{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.bars{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;align-items:end;height:120px}

.act{display:inline-grid;grid-template-columns:repeat(14,9px);gap:3px}
.act i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.07)}.act i.on{background:var(--v)}
.risk{color:#ffc6c6;font-weight:700;font-size:12px}
.rv{margin-bottom:12px;padding:16px;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.rv h3{font-size:15px;line-height:1.35}
.rv .meta{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.rv .ans{padding:12px 14px;border-radius:12px;background:#0B0A12;border:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.rv textarea{min-height:68px;margin-bottom:10px;font-size:15px}
.acc{border:1px solid var(--line);border-radius:18px;background:var(--s1);margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.acc>button b{font-size:15px}.acc>button span{font-size:12.5px;color:var(--muted)}
.acc .bd{padding:0 16px 16px}
.acc .rv{background:rgba(255,255,255,.02)}
.demo{position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:11.5px;font-weight:700;padding:3px;background:#5B2FBE;color:#fff;letter-spacing:.06em}
.tag-in{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tag-in label{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:13px;font-weight:600;cursor:pointer}
.tag-in input{accent-color:#9B6FE8}
.two{display:grid;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.hero{grid-template-columns:88px 1fr}.ring{width:88px;height:88px}}

/* ================= управление ================= */
const students=()=>(AD.users||[]).filter(u=>u.role==='student'&&u.name&&(!u.program||u.program===CURP));
function pmap(slot){const P={};(AD.progress||[]).filter(p=>p.slot===slot).forEach(p=>P[p.task_id]=p);return P}
function mmap(slot){const M={};(AD.meta||[]).filter(m=>m.slot===slot).forEach(m=>M[m.k]=m.v);return M}
function lastSeen(slot){let t=0;(AD.events||[]).forEach(e=>{if(e.slot===slot){const x=+new Date(e.at);if(x>t)t=x}});(AD.progress||[]).forEach(p=>{if(p.slot===slot){const x=+new Date(p.updated_at);if(x>t)t=x}});return t}
function daysOf(slot){return [...new Set((AD.events||[]).filter(e=>e.slot===slot).map(e=>ymd(new Date(e.at))))]}
function stat(u){
  const P=pmap(u.slot),M=mmap(u.slot),c=totals(P),N=TK.length;
  const exp=C.weeks.filter(w=>isOpen(w,M)&&w.tasks.length&&dnum(w.due)<=dnum(today()));
  const late=exp.filter(w=>!wsubm(w,P)).length,ls=lastSeen(u.slot),idle=ls?Math.floor((Date.now()-ls)/864e5):99;
  const started=dnum(today())>=dnum((C.weeks[1]||C.weeks[0]).opens);
  const risk=started&&(late>0||idle>=4)||(c.revision>=3);
  return {u,P,M,c,N,late,ls,idle,risk,reasons:[late?'просрочено недель: '+late:'',idle>=4&&started?(idle>=99?'ни разу не заходил(а)':'нет активности '+idle+' дн.'):'',c.revision>=3?'много возвратов: '+c.revision:''].filter(Boolean)};
}
function actStrip(days){const s=new Set(days),t=dnum(today());let h='';for(let i=13;i>=0;i--)h+=`<i class="${s.has(ymdOf(t-i))?'on':''}" title="${ymdOf(t-i)}"></i>`;return `<span class="act">${h}</span>`}

  <h2 class="t">Прогресс по неделям <small>принято, средний по потоку</small></h2><div class="card"><div class="bars">${C.weeks.map((w,i)=>`<div><span>${Math.round(wkAvg[i]*100)}%</span><i style="height:${Math.max(3,wkAvg[i]*88)}px;${isOpen(w,{})?'':'opacity:.3'}"></i><span>${w.n===0?'0':w.n>6?'+'+(w.n-6):w.n}</span></div>`).join('')}</div></div>
